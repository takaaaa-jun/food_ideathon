[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "W",
    "I",
    "B",
    "UP",
    "SIM",
    "C4",
    "PERF",
    "RUF",
]
ignore = [
    "T201",   # print() を許可
    "D400",   # docstring 末尾のピリオド強制を無効化
    "D415",   # docstring 末尾の句読点強制を無効化
    "INP001", # __init__.py 不要
    "ERA001", # コメントアウトされたコードを許可
    "RET504", # 不要な変数経由returnを許可
]

[tool.ruff.format]
preview = false

[tool.pyrefly]
python_version = "3.11"
project_includes = [
    "src/**/*.py",
    "tests/**/*.py",
    "*.py"
]
project_excludes = [
    "**/__pycache__/**",
    ".venv/**",
    "venv/**",
    "build/**",
    "dist/**",
]